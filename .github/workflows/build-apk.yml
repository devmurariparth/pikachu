name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected full Java version: $JAVA_VER"
          JAVA_MAJOR=$(echo "$JAVA_VER" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Active Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version is $JAVA_MAJOR, which is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully (version $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: APK file exists but is empty: $TARGET_APK"
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "Error: File does not have .apk extension: $TARGET_APK"
              exit 1
              ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Confirmed: Selected APK exists, is a regular file, is not empty, has .apk extension, and is exactly $TARGET_APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$ASSET_DIR"

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Release asset prepared: $ASSET_PATH ($ASSET_FILENAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Confirming GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset does not have .apk extension: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          ### Debug APK Build #${GITHUB_RUN_NUMBER}

          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Asset Filename: \`${ASSET_FILENAME}\`

          > **Notice**: The APK is intended for testing and is not a Play Store production release. The APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Publishing release tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "APK Asset Filename: $ASSET_FILENAME"

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Release Page URL: $RELEASE_URL"

            {
              echo "### 🚀 Debug APK Released Successfully"
              echo ""
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **Release Title**: ${RELEASE_TITLE}"
              echo "- **APK Asset Filename**: \`${ASSET_FILENAME}\`"
              echo "- **Release Page URL**: [Download from GitHub Release](${RELEASE_URL})"
              echo ""
              echo "The debug APK can be downloaded directly on your phone from the **Assets** section of the release page."
              echo ""
              echo "*Note: The standard GitHub Actions artifact named \`app-debug-apk\` is also available as a backup.*"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release publishing could not be completed or encountered an error."
            echo "The debug APK was built successfully."
            echo "The GitHub Actions artifact named 'app-debug-apk' remains available for download."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Fallback)"
              echo ""
              echo "- **Build Status**: Successful"
              echo "- **Actions Artifact**: \`app-debug-apk\` is available"
              echo "- **GitHub Release Publishing**: Skipped or failed"
              echo ""
              echo "The APK build succeeded and the artifact named **app-debug-apk** is preserved and available for direct download under the Artifacts section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
