name: Build and Release MJ v0.6.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mj-release-v0.6.0
  cancel-in-progress: false

jobs:
  build-test-release:
    name: Test, build and publish MJ APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests, lint and build debug APK
        run: ./gradlew testDebugUnitTest :app:lintDebug assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: MJ-v0.6.0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          name: MJ v0.6.0
          body: |
            MJ Android test release (versionName 0.6.0, versionCode 6).

            This build is based on the expanded MJ source in this repository. It includes the typed action pipeline, permission/policy checks, multilingual local routing, contact/call handling, music providers, messaging, tasks, assistant UI and the system voice-interaction entry point.

            Note: The system voice-interaction entry point requires the user to select MJ as the default digital assistant where supported. This is not an always-listening hotword implementation. Music apps may open a search/result view rather than guarantee playback; supported media intents are attempted first.

            This is a debug-signed APK for testing, not a production-signed Play Store release.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
